<title>Rehearsal Room</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: a two-pane chat. Left rail lists rehearsals; the main pane is the thread with a composer pinned at the bottom. */
  :root {
    --bg: #eef1f5; --surface: #ffffff; --surface-2: #f6f8fb; --ink: #17202b; --ink-2: #4f5b68; --ink-3: #8a94a0;
    --line: #d9dfe7; --accent: #1f6f8b; --accent-ink: #ffffff; --user: #dfe9f1;
    --go: #1e7b4f; --revise: #b4711c; --no_go: #b23a3a;
    --supportive: #1e7b4f; --neutral: #6b7682; --skeptical: #b4711c; --blocking: #b23a3a;
    --sans: "IBM Plex Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --r: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12161b; --surface: #1a2027; --surface-2: #202830; --ink: #e8edf2; --ink-2: #a9b4bf; --ink-3: #74808c;
      --line: #2c353f; --accent: #5fb3d0; --accent-ink: #0f1a20; --user: #243240; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12161b; --surface: #1a2027; --surface-2: #202830; --ink: #e8edf2; --ink-2: #a9b4bf; --ink-3: #74808c;
    --line: #2c353f; --accent: #5fb3d0; --accent-ink: #0f1a20; --user: #243240; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, textarea:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .app { display: grid; grid-template-columns: 280px 1fr; height: 100%; }
  @media (max-width: 820px) { .app { grid-template-columns: 1fr; } .rail { display: none; } .app.rail-open .rail { display: flex; position: fixed; inset: 0; z-index: 20; } }

  /* Rail */
  .rail { display: flex; flex-direction: column; background: var(--surface); border-right: 1px solid var(--line); min-width: 0; }
  .rail-head { padding: 16px max(16px, env(safe-area-inset-left, 0px)) 12px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .brand { font-weight: 600; letter-spacing: .01em; }
  .brand small { display: block; color: var(--ink-3); font-weight: 400; font-size: 12px; }
  .rail-list { flex: 1; overflow-y: auto; padding: 8px; }
  .rail-item { width: 100%; text-align: left; background: none; border: 0; border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px; }
  .rail-item:hover { background: var(--surface-2); }
  .rail-item.active { background: var(--user); }
  .rail-item .t { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rail-item .m { color: var(--ink-3); font-size: 12px; display: flex; gap: 8px; align-items: center; }
  .rail-foot { padding: 10px 8px max(10px, env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); display: grid; gap: 4px; }
  .rail-foot button { background: none; border: 0; border-radius: 10px; padding: 8px 12px; text-align: left; color: var(--ink-2); }
  .rail-foot button:hover { background: var(--surface-2); }

  /* Main */
  .main { display: flex; flex-direction: column; min-width: 0; height: 100%; }
  .topbar { display: flex; align-items: center; gap: 10px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); background: var(--surface); }
  .topbar .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .icon-btn { background: none; border: 1px solid var(--line); border-radius: 9px; padding: 6px 10px; color: var(--ink-2); }
  .icon-btn:hover { background: var(--surface-2); }
  .menu-btn { display: none; }
  @media (max-width: 820px) { .menu-btn { display: inline-block; } }
  .thread { flex: 1; overflow-y: auto; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); }
  .thread-inner { max-width: 820px; margin: 0 auto; display: grid; gap: 14px; }

  /* Messages */
  .msg { display: grid; grid-template-columns: 36px 1fr; gap: 10px; align-items: start; }
  .msg.user { grid-template-columns: 1fr 36px; }
  .msg.user .bubble { background: var(--user); border-color: transparent; }
  .avatar { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font: 500 12px/1 var(--mono); color: #fff; letter-spacing: .02em; }
  .msg.user .avatar { order: 2; background: var(--ink-2); }
  .bubble { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; min-width: 0; }
  .bubble.judge { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent); }
  .who { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
  .who .name { font-weight: 600; }
  .who .sub { color: var(--ink-3); font-size: 12px; }
  .pill { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: #fff; }
  .pill.verdict-go { background: var(--go); } .pill.verdict-revise { background: var(--revise); } .pill.verdict-no_go { background: var(--no_go); }
  .pill.supportive { background: var(--supportive); } .pill.neutral { background: var(--neutral); } .pill.skeptical { background: var(--skeptical); } .pill.blocking { background: var(--blocking); }
  .sev { font: 500 10px/1 var(--mono); text-transform: uppercase; letter-spacing: .06em; padding: 2px 5px; border-radius: 4px; border: 1px solid currentColor; }
  .sev.high { color: var(--no_go); } .sev.medium { color: var(--revise); } .sev.low { color: var(--ink-3); }
  .bubble p { margin: 0 0 8px; } .bubble p:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { margin: 4px 0 8px; padding-left: 20px; } .bubble li { margin: 3px 0; }
  .bubble h4 { margin: 10px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 600; }
  .q { border-left: 3px solid var(--accent); padding: 6px 10px; margin: 8px 0; background: color-mix(in srgb, var(--accent) 7%, transparent); border-radius: 0 8px 8px 0; }
  .q .ask { font-weight: 500; }
  .where { color: var(--ink-3); font-style: italic; font-size: 13px; }
  .muted { color: var(--ink-3); } .small { font-size: 13px; }
  .err { color: var(--no_go); }
  details { margin: 6px 0; } summary { cursor: pointer; color: var(--accent); font-size: 13px; }
  pre { white-space: pre-wrap; font: 13px/1.5 var(--mono); margin: 6px 0; overflow-x: auto; }
  .thinking { display: inline-flex; gap: 4px; align-items: center; color: var(--ink-3); font-size: 13px; }
  .thinking i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); animation: blink 1.2s infinite; }
  .thinking i:nth-child(2) { animation-delay: .2s; } .thinking i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .thinking i { animation: none; opacity: .6; } }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 6px 12px; font-size: 13px; color: var(--ink-2); }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 500; }
  .btn.primary:disabled { opacity: .5; cursor: default; }
  .system { text-align: center; color: var(--ink-3); font-size: 13px; }
  .lq { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin: 6px 0; }
  .lq .ask { font-weight: 500; } .lq .say { margin-top: 4px; }

  /* Composer */
  .composer { border-top: 1px solid var(--line); background: var(--surface); padding: 12px max(16px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .composer-inner { max-width: 820px; margin: 0 auto; display: grid; gap: 8px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 4px 11px; font-size: 13px; color: var(--ink-2); }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .chip.role { padding-left: 6px; display: inline-flex; align-items: center; gap: 6px; }
  .chip .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  textarea { width: 100%; min-height: 96px; max-height: 40vh; resize: vertical; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--surface-2); line-height: 1.45; }
  textarea.followup { min-height: 44px; }
  input[type="text"], select { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--surface-2); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row .grow { flex: 1; min-width: 160px; }
  .hint { color: var(--ink-3); font-size: 12px; }
  .warn { background: color-mix(in srgb, var(--revise) 12%, transparent); border: 1px solid color-mix(in srgb, var(--revise) 40%, transparent); border-radius: 10px; padding: 8px 12px; font-size: 13px; }

  /* Panels (profile, settings) */
  .sheet { position: fixed; inset: 0; background: color-mix(in srgb, var(--ink) 40%, transparent); z-index: 30; display: grid; place-items: center; padding: 16px; }
  .sheet .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; width: min(760px, 100%); max-height: 90vh; overflow: auto; padding: 18px; display: grid; gap: 12px; }
  .sheet h3 { margin: 0; }
  .sheet textarea { min-height: 50vh; font-family: var(--mono); font-size: 13px; }
  .field { display: grid; gap: 4px; }
  .field label { font-size: 13px; color: var(--ink-2); font-weight: 500; }
  .debrief-item { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; border-top: 1px solid var(--line); }
  .debrief-item input { margin-top: 4px; }
</style>

<div class="app" id="app">
  <aside class="rail" id="rail">
    <div class="rail-head">
      <div class="brand">Rehearsal Room<small>Pre-meeting panel for your decks and decisions</small></div>
      <button class="icon-btn menu-btn" id="railClose" aria-label="Close menu">✕</button>
    </div>
    <div class="rail-list" id="railList"></div>
    <div class="rail-foot">
      <button id="newBtn">+ New rehearsal</button>
      <button id="profileBtn">Workplace profile</button>
      <button id="settingsBtn">Settings</button>
    </div>
  </aside>

  <section class="main">
    <div class="topbar">
      <button class="icon-btn menu-btn" id="railOpen" aria-label="Open menu">☰</button>
      <div class="title" id="title">New rehearsal</div>
      <button class="icon-btn" id="copyBtn" hidden>Copy brief</button>
    </div>
    <div class="thread" id="thread"><div class="thread-inner" id="threadInner"></div></div>
    <div class="composer"><div class="composer-inner" id="composer"></div></div>
  </section>
</div>

<div class="sheet" id="sheet" hidden></div>

<script id="data" type="application/json">__REHEARSAL_DATA__</script>
<script>
(() => {
"use strict";
const DATA = JSON.parse(document.getElementById("data").textContent);

// ---------------------------------------------------------------- presentation
const LOOK = {
  coach: ["CO", "#1f6f8b"], advocate: ["AD", "#2a7d4f"], challenger: ["CH", "#b23a3a"], judge: ["JD", "#3d3f9c"],
  director: ["DR", "#1e3a5f"], senior_manager: ["SM", "#2b6cb0"], methodology_reviewer: ["MR", "#6b46c1"],
  risk_compliance: ["RC", "#b7791f"], tech_product: ["TP", "#0e7490"], finance: ["FI", "#5f6b1f"],
  customer: ["CU", "#b83280"], strategy_partner: ["SP", "#7c3aed"], ops: ["OP", "#8b5a2b"], cross_lob_ba: ["XL", "#4a5568"],
};
const look = (id) => LOOK[id] || [id.slice(0, 2).toUpperCase(), "#555"];
const roleName = (id) => (DATA.roles[id] && DATA.roles[id].name) || id;
const PANEL_IDS = Object.values(DATA.roles).filter(r => r.layer === "panel").map(r => r.id);
const LANGS = { en: "English", "zh-TW": "Traditional Chinese" };
const TIER = { coach: "complex", judge: "complex", panel: "default" };

// ---------------------------------------------------------------- state
let sample = null, db = null, uid = null;
let settings = { language: "en", depth: "standard" };
let profile = { workplace: DATA.profileDefault, debriefLog: DATA.debriefLogDefault };
let sessions = [];            // summaries
let current = null;           // full session object
let running = false;
let abortCtl = null;
const el = (id) => document.getElementById(id);
const h = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ---------------------------------------------------------------- storage
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
function userCol() { return (db && uid) ? db.collection("data/users/" + uid) : null; }
async function loadAll() {
  const col = userCol();
  if (col) {
    try {
      const p = await col.doc("profile").get();
      if (p.exists) { const d = p.data(); profile = { workplace: d.workplace || profile.workplace, debriefLog: d.debriefLog || profile.debriefLog }; settings = { ...settings, ...(d.settings || {}) }; }
      const q = await col.where("kind", "==", "session").get();
      sessions = q.docs.map(d => d.data()).sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || ""));
      return;
    } catch (e) { console.warn("db read failed, using local storage", e); }
  }
  profile = LS.get("profile", profile); settings = { ...settings, ...LS.get("settings", {}) };
  sessions = LS.get("sessions", []).sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || ""));
}
async function saveProfile() {
  const col = userCol();
  if (col) { try { await col.doc("profile").set({ kind: "profile", workplace: profile.workplace, debriefLog: profile.debriefLog, settings }); return; } catch (e) { console.warn(e); } }
  LS.set("profile", profile); LS.set("settings", settings);
}
let saveChain = Promise.resolve();
function saveSession(s) {
  // one write at a time per document
  saveChain = saveChain.then(async () => {
    const i = sessions.findIndex(x => x.id === s.id);
    if (i >= 0) sessions[i] = s; else sessions.unshift(s);
    const col = userCol();
    if (col) { try { await col.doc("session_" + s.id).set(JSON.parse(JSON.stringify(s))); return; } catch (e) { console.warn(e); } }
    LS.set("sessions", sessions);
  });
  return saveChain;
}
async function deleteSession(s) {
  sessions = sessions.filter(x => x.id !== s.id);
  const col = userCol();
  if (col) { try { await col.doc("session_" + s.id).delete(); } catch (e) { console.warn(e); } }
  LS.set("sessions", sessions);
}

// ---------------------------------------------------------------- prompts (mirror rehearsal/engine.py)
const dump = (o) => o ? JSON.stringify(o, null, 2) : "(unavailable)";
function protocol(panel) {
  let p = DATA.protocol.replace("{language}", LANGS[settings.language] || settings.language);
  if (panel) p += DATA.panelProtocolExtra;
  return p;
}
function profileBlock() {
  return "# Workplace profile (maintained by the analyst; read it before the material)\n\n" + (profile.workplace || "(No workplace profile provided.)") +
    "\n\n# Debrief log (what real stakeholders actually asked in past meetings)\n\n" + (profile.debriefLog || "(No debrief history yet.)");
}
function materialBlock(s) {
  const m = DATA.modes[s.mode];
  return `# Mode: ${m.title}\n${m.emphasis}\n\n# Material\n\n${s.material.trim()}\n\n# What the analyst is worried about\n${(s.worry || "").trim() || "(not stated)"}\n`;
}
function structureBlock(st) {
  if (!st) return "# Coach's structure analysis\n(unavailable for this run)\n";
  const lines = ["# Coach's structure analysis (read alongside the material; it is a map, not a verdict)",
    `Restatement: ${st.one_line_restatement}`, `Central question: ${st.central_question}`,
    `Leads with answer: ${st.leads_with_answer ? "yes" : "no"}. ${st.answer_first_note}`, "Issue tree:"];
  for (const b of st.issue_tree || []) { lines.push(`- ${b.sub_question}`); for (const p of b.sub_points || []) lines.push(`  - ${p}`); }
  if ((st.mece_gaps || []).length) lines.push("MECE gaps: " + st.mece_gaps.join("; "));
  if ((st.logic_breaks || []).length) { lines.push("Logic breaks:"); for (const lb of st.logic_breaks) lines.push(`- ${lb.claim} (${lb.where_in_material}): ${lb.why_it_does_not_follow}`); }
  return lines.join("\n") + "\n";
}
function formatBlock(schemaName) {
  return `\n# Output format\nReply with only one JSON object, no prose before or after, that validates against this JSON Schema (${schemaName}). Every required field must be present.\n\n\`\`\`json\n${JSON.stringify(DATA.schemas[schemaName])}\n\`\`\`\n`;
}
function basePrompt(roleId, panel) {
  const r = DATA.roles[roleId];
  return protocol(panel) + "\n\n# Your role: " + r.name + "\n\n" + r.body + "\n\n" + profileBlock() + "\n\n";
}
const P = {
  coachPre: (s) => basePrompt("coach", false) + materialBlock(s) + "\n# Task\nThis is the PRE-PASS. Produce the structure analysis described in your role. Do not evaluate the recommendation; map the argument.\n" + formatBlock("StructureAnalysis"),
  advocate: (s) => basePrompt("advocate", false) + materialBlock(s) + "\n" + structureBlock(s.outputs.coach_pre) + "\n# Task\nBuild the strongest honest case for this material.\n" + formatBlock("AdvocateOutput"),
  challenger: (s) => basePrompt("challenger", false) + materialBlock(s) + "\n" + structureBlock(s.outputs.coach_pre) + "\n# Task\nFind the holes, ranked by damage if raised live.\n" + formatBlock("ChallengerOutput"),
  panelist: (s, id) => basePrompt(id, true) + materialBlock(s) + "\n" + structureBlock(s.outputs.coach_pre) + `\n# Task\nRespond as ${roleName(id)}, following the output schema.\n` + formatBlock("PanelistOutput"),
  judge: (s) => {
    const parts = [basePrompt("judge", false) + materialBlock(s) + "\n" + structureBlock(s.outputs.coach_pre),
      `# Judge focus for this mode\n${DATA.modes[s.mode].judge_focus}\n`, "# Advocate\n" + dump(s.outputs.advocate), "# Challenger\n" + dump(s.outputs.challenger), "# Panel (independent responses)"];
    for (const id of s.panelIds) parts.push(`## ${roleName(id)} (\`${id}\`)\n` + dump(s.outputs.panel[id]));
    const errs = Object.entries(s.errors || {});
    if (errs.length) parts.push("# Roles that failed to respond\n" + errs.map(([k, v]) => `- ${k}: ${v}`).join("\n"));
    parts.push("# Task\nProduce the pre-meeting brief described in your role, following the output schema.");
    return parts.join("\n\n") + formatBlock("JudgeBrief");
  },
  coachPost: (s) => basePrompt("coach", false) + materialBlock(s) + "\n" + structureBlock(s.outputs.coach_pre) + "\n# Judge's brief\n" + dump(s.outputs.judge) +
    "\n\n# Task\nThis is the POST-PASS. Propose the restructured storyline described in your role, addressing the Judge's must-fix items where structure can address them.\n" + formatBlock("Storyline"),
};
const SCHEMA_FOR = { coach_pre: "StructureAnalysis", advocate: "AdvocateOutput", challenger: "ChallengerOutput", judge: "JudgeBrief", coach_post: "Storyline" };
function validate(schemaName, v) {
  const sch = DATA.schemas[schemaName];
  if (!v || typeof v !== "object" || Array.isArray(v)) return "not an object";
  for (const k of sch.required || []) if (!(k in v)) return "missing field " + k;
  return null;
}

// ---------------------------------------------------------------- pipeline
const ERR_COPY = {
  not_granted: "You have not allowed this page to use Claude. Allow it from the page's permissions menu and start again.",
  sampling_disabled: "Claude is not available on this account.", rate_limited: "Too many requests right now. Wait a minute, then retry this role.",
  session_expired: "Your sign-in expired. Reload and sign in again.", refused: "Claude declined this input. Change the material and try again.",
  invalid_json: "The reply was not valid JSON. Retry this role.", empty_completion: "Claude returned nothing. Retry this role.",
  prompt_too_large: "The material is too long. Shorten it and start a new rehearsal.", cancelled: "Stopped.",
};
const copyFor = (e) => ERR_COPY[e && e.code] || ("Something went wrong (" + ((e && e.code) || "unknown") + "). Retry this role.");
const tierFor = (kind) => (kind === "panel" && settings.depth === "deep") ? "complex" : TIER[kind];

async function askRole(s, key, kind, prompt, schemaName) {
  s.status[key] = "running"; render();
  try {
    const v = await sample.json(prompt, { modelTier: tierFor(kind), effort: kind === "panel" ? "medium" : "high", signal: abortCtl ? abortCtl.signal : undefined });
    const bad = validate(schemaName, v);
    if (bad) throw { code: "invalid_json", message: bad };
    if (key.startsWith("panel:")) s.outputs.panel[key.slice(6)] = v; else s.outputs[key] = v;
    delete s.errors[key]; s.status[key] = "done";
  } catch (e) {
    if (e && e.code === "cancelled") { s.status[key] = "idle"; }
    else { s.errors[key] = (e && e.code) || "unknown"; s.errorText = s.errorText || {}; s.errorText[key] = copyFor(e); s.status[key] = "error"; console.warn(key, e); }
  }
  await saveSession(s); render();
}
async function pool(tasks, n) {
  const q = tasks.slice(); const workers = [];
  for (let i = 0; i < n; i++) workers.push((async () => { while (q.length) { const t = q.shift(); await t(); } })());
  await Promise.all(workers);
}
async function runPipeline(s, from) {
  if (running) return; running = true; abortCtl = new AbortController(); render();
  try {
    const stages = ["coach_pre", "panel", "judge", "coach_post"];
    for (const stage of stages.slice(stages.indexOf(from || "coach_pre"))) {
      if (abortCtl.signal.aborted) break;
      if (stage === "coach_pre") { if (!s.outputs.coach_pre) await askRole(s, "coach_pre", "coach", P.coachPre(s), "StructureAnalysis"); }
      else if (stage === "panel") {
        const tasks = [];
        if (!s.outputs.advocate) tasks.push(() => askRole(s, "advocate", "panel", P.advocate(s), "AdvocateOutput"));
        if (!s.outputs.challenger) tasks.push(() => askRole(s, "challenger", "panel", P.challenger(s), "ChallengerOutput"));
        for (const id of s.panelIds) if (!s.outputs.panel[id]) tasks.push(() => askRole(s, "panel:" + id, "panel", P.panelist(s, id), "PanelistOutput"));
        for (const t of tasks) { /* mark queued so the thread shows every seat */ }
        await pool(tasks, 3);
      }
      else if (stage === "judge") { if (!s.outputs.judge) await askRole(s, "judge", "judge", P.judge(s), "JudgeBrief"); }
      else if (stage === "coach_post") { if (!s.outputs.coach_post && s.outputs.judge) await askRole(s, "coach_post", "coach", P.coachPost(s), "Storyline"); }
    }
    s.phase = s.outputs.coach_post ? "done" : (s.outputs.judge ? "done" : "partial");
  } finally { running = false; abortCtl = null; await saveSession(s); render(); }
}
async function retryRole(key) {
  const s = current; if (!s || running) return;
  running = true; abortCtl = new AbortController(); render();
  try {
    if (key === "coach_pre") await askRole(s, key, "coach", P.coachPre(s), "StructureAnalysis");
    else if (key === "advocate") await askRole(s, key, "panel", P.advocate(s), "AdvocateOutput");
    else if (key === "challenger") await askRole(s, key, "panel", P.challenger(s), "ChallengerOutput");
    else if (key === "judge") { delete s.outputs.judge; delete s.outputs.coach_post; await askRole(s, key, "judge", P.judge(s), "JudgeBrief"); if (s.outputs.judge) await askRole(s, "coach_post", "coach", P.coachPost(s), "Storyline"); }
    else if (key === "coach_post") await askRole(s, key, "coach", P.coachPost(s), "Storyline");
    else if (key.startsWith("panel:")) await askRole(s, key, "panel", P.panelist(s, key.slice(6)), "PanelistOutput");
  } finally { running = false; abortCtl = null; await saveSession(s); render(); }
}

// ---------------------------------------------------------------- follow-ups
async function followUp(roleKey, question) {
  const s = current; if (!s || running) return;
  const id = roleKey; const isPanel = PANEL_IDS.includes(id);
  const prior = id === "judge" ? s.outputs.judge : id === "coach" ? s.outputs.coach_post : id === "advocate" ? s.outputs.advocate : id === "challenger" ? s.outputs.challenger : s.outputs.panel[id];
  const lead = basePrompt(id, isPanel) + materialBlock(s) + "\n" + structureBlock(s.outputs.coach_pre) +
    (id === "judge" ? "\n# Advocate\n" + dump(s.outputs.advocate) + "\n# Challenger\n" + dump(s.outputs.challenger) + "\n# Panel\n" + s.panelIds.map(p => `## ${roleName(p)}\n` + dump(s.outputs.panel[p])).join("\n") : "") +
    "\n\n# Your earlier response (as JSON)\n" + dump(prior) +
    "\n\n# Follow-up conversation\nThe analyst now asks you follow-up questions. Stay in character. Answer in prose, directly, in at most 150 words. No JSON.";
  const turns = (s.followups || []).filter(f => f.role === id).flatMap(f => [{ role: "user", content: f.q }, { role: "assistant", content: f.a }]);
  const entry = { role: id, q: question, a: "", at: new Date().toISOString(), pending: true };
  s.followups = s.followups || []; s.followups.push(entry); running = true; abortCtl = new AbortController(); render();
  try {
    const { text } = await sample([{ role: "user", content: lead }, ...turns, { role: "user", content: question }], {
      cache: false, modelTier: "default", signal: abortCtl.signal, onText: ({ text }) => { entry.a = text; renderFollowupLive(); },
    });
    entry.a = text;
  } catch (e) { entry.a = (e && e.text) || ""; entry.error = e && e.code === "cancelled" ? "" : copyFor(e); }
  finally { entry.pending = false; running = false; abortCtl = null; await saveSession(s); render(); }
}
function renderFollowupLive() { const n = document.querySelector("[data-live-followup]"); if (n) n.textContent = current.followups[current.followups.length - 1].a || "…"; }

// ---------------------------------------------------------------- debrief
function debriefEntry(s, d) {
  const qs = s.outputs.judge.likely_questions || [];
  const asked = qs.filter((_, i) => d.asked.includes(i)), missed = qs.filter((_, i) => !d.asked.includes(i));
  const L = [`## ${d.recordedAt.slice(0, 10)} · ${s.mode} · ${s.id}`, `Outcome: ${d.outcome || "(not recorded)"}`, "Predicted and asked:"];
  L.push(...(asked.length ? asked.map(q => `- ${q.question} (predicted for ${q.asked_by})`) : ["- (none)"]));
  L.push("Predicted, not asked:"); L.push(...(missed.length ? missed.map(q => `- ${q.question} (predicted for ${q.asked_by})`) : ["- (none)"]));
  L.push("Not predicted, but asked:"); L.push(...(d.unpredicted.length ? d.unpredicted.map(q => `- ${q}`) : ["- (none)"]));
  if (d.notes) { L.push("Notes:"); L.push(`- ${d.notes}`); }
  return L.join("\n") + "\n";
}

      `<details><summary>Objections and rebuttals</summary>${list(a.objections_and_rebuttals, r => `<li><strong>${h(r.objection)}</strong><br>${h(r.rebuttal)}${r.supported_by_material ? "" : `<br><span class="small err">Needs evidence: ${h(r.evidence_needed)}</span>`}</li>`)}</details>`));

    <div class="field"><label for="dout">Outcome in the room</label><input type="text" id="dout" value="${h(d.outcome)}" placeholder="approved / sent back / deferred, and why"></div>
    <div class="field"><label for="dnotes">Anything worth remembering</label><textarea id="dnotes" style="min-height:70px">${h(d.notes)}</textarea></div>
    <div class="actions"><button class="btn primary" id="dsave">Save debrief</button><button class="btn" id="dclose">Cancel</button></div>`);
  el("dsave").onclick = async () => {
    const asked = [...document.querySelectorAll("[data-q]")].filter(x => x.checked).map(x => Number(x.dataset.q));
    const nd = { recordedAt: new Date().toISOString(), asked, unpredicted: el("dun").value.split("\n").map(x => x.trim()).filter(Boolean), outcome: el("dout").value.trim(), notes: el("dnotes").value.trim() };
    const entry = debriefEntry(s, nd);
    if (s.debrief && s.debrief.logEntry) profile.debriefLog = profile.debriefLog.replace(s.debrief.logEntry, entry); else profile.debriefLog = (profile.debriefLog || "").replace(/\s*$/, "") + "\n\n" + entry;
    nd.logEntry = entry; s.debrief = nd;
    await saveProfile(); await saveSession(s); closeSheet(); render();
  };
  el("dclose").onclick = closeSheet;
}

// ---------------------------------------------------------------- brief export
function briefMarkdown(s) {
  const j = s.outputs.judge; const L = [`# ${DATA.modes[s.mode].title}: ${sessionTitle(s)}`, `**Verdict: ${j.verdict.replace("_", " ").toUpperCase()}.** ${j.headline}`, ""];
  if (j.decision) L.push(`**Decision:** ${j.decision}`, "");
  L.push("## Must fix before sending", ...j.must_fix_before_sending.map((x, i) => `${i + 1}. ${x}`), "", "## Questions you will be asked");
  for (const q of j.likely_questions) L.push(`- **${q.question}** (${q.asked_by})`, `  - Say: ${q.suggested_answer}`);
  if (j.blind_spots.length) L.push("", "## Blind spots", ...j.blind_spots.map(x => `- ${x}`));
  if (s.outputs.coach_post) L.push("", "## Recommended storyline", ...s.outputs.coach_post.recommended_storyline.map((x, i) => `${i + 1}. **${x.title}** ${x.key_message}`));
  return L.join("\n");
}

// ---------------------------------------------------------------- events
function newSession() {
  if (running) return;
  current = null; render();
}
async function startRun() {
  const material = el("material").value.trim(); if (!material) { el("material").focus(); return; }
  const mode = DATA.modes[draft.mode]; const panelIds = (draft.panel || mode.panel).slice();
  const now = new Date(); const id = now.toISOString().replace(/[-:T]/g, "").slice(0, 14) + "-" + draft.mode;
  current = { kind: "session", id, createdAt: now.toISOString(), mode: draft.mode, material, worry: el("worry").value.trim(), panelIds, language: settings.language, phase: "running",
    outputs: { coach_pre: null, advocate: null, challenger: null, judge: null, coach_post: null, panel: {} }, status: {}, errors: {}, followups: [], debrief: null };
  draft = { ...draft, material: "", worry: "" }; LS.set("draft", draft);
  await saveSession(current); render();
  await runPipeline(current);
}
document.addEventListener("click", async (e) => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.id === "newBtn") { newSession(); el("app").classList.remove("rail-open"); }
  else if (t.id === "profileBtn") openProfile();
  else if (t.id === "settingsBtn") openSettings();
  else if (t.id === "railOpen") el("app").classList.add("rail-open");
  else if (t.id === "railClose") el("app").classList.remove("rail-open");
  else if (t.dataset.open) { if (running) return; current = sessions.find(s => s.id === t.dataset.open) || null; if (current && !current.status) current.status = {}; el("app").classList.remove("rail-open"); render(); if (current && current.phase === "running") { current.phase = "partial"; await saveSession(current); render(); } }
  else if (t.dataset.mode) { draft.mode = t.dataset.mode; draft.panel = null; draft.material = el("material").value; draft.worry = el("worry").value; LS.set("draft", draft); renderComposer(); }
  else if (t.dataset.panel) { const p = (draft.panel || DATA.modes[draft.mode].panel).slice(); const i = p.indexOf(t.dataset.panel); if (i >= 0) { if (p.length > 1) p.splice(i, 1); } else p.push(t.dataset.panel); draft.panel = p; draft.material = el("material").value; draft.worry = el("worry").value; LS.set("draft", draft); renderComposer(); const d = el("composer").querySelector("details"); if (d) d.open = true; }
  else if (t.id === "go") startRun();
  else if (t.dataset.retry) retryRole(t.dataset.retry);
  else if (t.dataset.resume) runPipeline(current, "judge");
  else if (t.dataset.stop) { if (abortCtl) abortCtl.abort(); }
  else if (t.dataset.target) { followTarget = t.dataset.target; renderComposer(); el("fq").focus(); }
  else if (t.id === "fsend") { const q = el("fq").value.trim(); if (q) { el("fq").value = ""; followUp(followTarget, q); } }
  else if (t.id === "revise") { if (running) return; draft = { ...draft, mode: current.mode, material: current.material, worry: current.worry, panel: current.panelIds.slice() }; LS.set("draft", draft); current = null; render(); el("material").focus(); }
  else if (t.dataset.debrief) openDebrief();
  else if (t.id === "copyBtn") {
    const md = briefMarkdown(current);
    try { await navigator.clipboard.writeText(md); t.textContent = "Copied"; setTimeout(() => t.textContent = "Copy brief", 1500); }
    catch { openSheet(`<h3>Brief as Markdown</h3><textarea readonly style="min-height:50vh">${h(md)}</textarea><div class="actions"><button class="btn" id="mclose">Close</button></div>`); el("mclose").onclick = closeSheet; }
  }
});
document.addEventListener("keydown", (e) => {
  if (e.target.id === "fq" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); el("fsend").click(); }
});
document.addEventListener("input", (e) => { if (e.target.id === "material" || e.target.id === "worry") { draft.material = el("material").value; draft.worry = el("worry").value; LS.set("draft", draft); } });
el("sheet").addEventListener("click", (e) => { if (e.target === el("sheet")) closeSheet(); });

// ---------------------------------------------------------------- boot
render();
(async () => {
  const use = (n) => (window.claude && window.claude.use) ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
  const [sm, d, u] = await Promise.all([use("sample"), use("db"), use("user")]);
  sample = sm; db = d;
  try { uid = u ? await u.id() : null; } catch { uid = null; }
  await loadAll();
  render();
})();
})();
</script>
