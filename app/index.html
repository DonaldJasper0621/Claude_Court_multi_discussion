      ((j.blind_spots || []).length ? `<h4>Blind spots</h4>` + list(j.blind_spots, x => `<li>${h(x)}</li>`) : "") +
      ((j.dissent || []).length ? `<details><summary>Where the panel disagrees</summary>${j.dissent.map(d => `<p><strong>${h(d.topic)}</strong></p>${list(d.positions, x => `<li>${h(x)}</li>`)}<p class="small"><span class="muted">Root cause:</span> ${h(d.root_cause)}</p>`).join("")}</details>` : "") +
      `<details><summary>Consensus and next steps</summary>${list(j.consensus, x => `<li>${h(x)}</li>`)}<h4>Next steps</h4>${list(j.next_steps, x => `<li>${h(x)}</li>`)}</details>` +
      `<div class="actions"><button class="btn" data-debrief="1">${s.debrief ? "Edit debrief" : "Record what was actually asked"}</button><button class="btn" data-retry="judge">Re-run Judge</button></div>`, "judge"));
  } else if (s.status.judge || (o.coach_pre && !running && s.phase !== "new")) parts.push(pending("judge", "pre-meeting brief", "judge", s));

  // Coach post
  if (o.coach_post) {
    const c = o.coach_post;
    parts.push(msg("coach", who("coach", "recommended storyline") + `<p><strong>In one sentence:</strong> ${h(c.one_line_restatement)}</p><h4>Open with</h4><ul><li><strong>Situation.</strong> ${h(c.opening_scqa.situation)}</li><li><strong>Complication.</strong> ${h(c.opening_scqa.complication)}</li><li><strong>Question.</strong> ${h(c.opening_scqa.question)}</li><li><strong>Answer.</strong> ${h(c.opening_scqa.answer)}</li></ul>` +
      `<h4>Storyline</h4><ol>${(c.recommended_storyline || []).map(x => `<li><strong>${h(x.title)}</strong><br>${h(x.key_message)}<br><span class="small muted">${h(x.why_here)}</span></li>`).join("")}</ol>` +
      `<details><summary>Changes from your version and the so-what ladder</summary>${list(c.changes_from_original, x => `<li>${h(x)}</li>`)}<h4>So-what ladder</h4><ol>${(c.so_what_ladder || []).map(x => `<li>${h(x)}</li>`).join("")}</ol></details>`));
  } else if (s.status.coach_post) parts.push(pending("coach", "recommended storyline", "coach_post", s));

  // Debrief
  if (s.debrief) {
    const d = s.debrief; const qs = o.judge ? o.judge.likely_questions : [];
    parts.push(`<div class="msg user"><div class="bubble"><div class="who"><span class="name">Debrief</span><span class="sub">${h(d.recordedAt.slice(0, 10))} · ${h(d.outcome)}</span></div>` +
      list(qs, (q, i) => `<li>${d.asked.includes(i) ? "✓" : "—"} ${h(q.question)}</li>`) + (d.unpredicted.length ? `<h4>Not predicted</h4>${list(d.unpredicted, x => `<li>${h(x)}</li>`)}` : "") + (d.notes ? `<p class="small">${h(d.notes)}</p>` : "") + `</div><div class="avatar">YOU</div></div>`);
  }

  // Follow-ups
  for (const f of s.followups || []) {
    parts.push(`<div class="msg user"><div class="bubble"><div class="who"><span class="name">You</span><span class="sub">to ${h(roleName(f.role))}</span></div><p>${h(f.q)}</p></div><div class="avatar">YOU</div></div>`);
    parts.push(msg(f.role, who(f.role) + (f.pending ? `<p data-live-followup>${h(f.a) || "…"}</p>` : `<p>${h(f.a)}</p>`) + (f.error ? `<p class="err small">${h(f.error)}</p>` : "")));
  }
  if (running && !(s.followups || []).some(f => f.pending)) parts.push(`<div class="system">Running… each role is one call to Claude. <button class="btn" data-stop="1">Stop</button></div>`);
  else if (s.phase === "partial" && !running) parts.push(`<div class="system">Some roles failed. Retry them above, or <button class="btn" data-resume="1">continue to the Judge</button> without them.</div>`);
  inner.innerHTML = parts.join("");
  const t = el("thread"); t.scrollTop = t.scrollHeight;
}

  else if (t.id === "railOpen") el("app").classList.add("rail-open");
  else if (t.id === "railClose") el("app").classList.remove("rail-open");
  else if (t.dataset.open) { if (running) return; current = sessions.find(s => s.id === t.dataset.open) || null; if (current && !current.status) current.status = {}; el("app").classList.remove("rail-open"); render(); if (current && current.phase === "running") { current.phase = "partial"; await saveSession(current); render(); } }
  else if (t.dataset.mode) { draft.mode = t.dataset.mode; draft.panel = null; draft.material = el("material").value; draft.worry = el("worry").value; LS.set("draft", draft); renderComposer(); }
  else if (t.dataset.panel) { const p = (draft.panel || DATA.modes[draft.mode].panel).slice(); const i = p.indexOf(t.dataset.panel); if (i >= 0) { if (p.length > 1) p.splice(i, 1); } else p.push(t.dataset.panel); draft.panel = p; draft.material = el("material").value; draft.worry = el("worry").value; LS.set("draft", draft); renderComposer(); const d = el("composer").querySelector("details"); if (d) d.open = true; }
  else if (t.id === "go") startRun();
  else if (t.dataset.retry) retryRole(t.dataset.retry);
  else if (t.dataset.resume) runPipeline(current, "judge");
  else if (t.dataset.stop) { if (abortCtl) abortCtl.abort(); }
  else if (t.dataset.target) { followTarget = t.dataset.target; renderComposer(); el("fq").focus(); }
  else if (t.id === "fsend") { const q = el("fq").value.trim(); if (q) { el("fq").value = ""; followUp(followTarget, q); } }
  else if (t.id === "revise") { if (running) return; draft = { ...draft, mode: current.mode, material: current.material, worry: current.worry, panel: current.panelIds.slice() }; LS.set("draft", draft); current = null; render(); el("material").focus(); }
  else if (t.dataset.debrief) openDebrief();
  else if (t.id === "copyBtn") {
    const md = briefMarkdown(current);
    try { await navigator.clipboard.writeText(md); t.textContent = "Copied"; setTimeout(() => t.textContent = "Copy brief", 1500); }
    catch { openSheet(`<h3>Brief as Markdown</h3><textarea readonly style="min-height:50vh">${h(md)}</textarea><div class="actions"><button class="btn" id="mclose">Close</button></div>`); el("mclose").onclick = closeSheet; }
  }
});
document.addEventListener("keydown", (e) => {
  if (e.target.id === "fq" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); el("fsend").click(); }
});
document.addEventListener("input", (e) => { if (e.target.id === "material" || e.target.id === "worry") { draft.material = el("material").value; draft.worry = el("worry").value; LS.set("draft", draft); } });
el("sheet").addEventListener("click", (e) => { if (e.target === el("sheet")) closeSheet(); });

// ---------------------------------------------------------------- boot
render();
(async () => {
  const use = (n) => (window.claude && window.claude.use) ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
  const [sm, d, u] = await Promise.all([use("sample"), use("db"), use("user")]);
  sample = sm; db = d;
  try { uid = u ? await u.id() : null; } catch { uid = null; }
  await loadAll();
  render();
})();
})();
</script>
